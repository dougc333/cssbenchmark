<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 3 — Left-column geometry</title>
  <style>
    @font-face {
      font-family: "DM Sans";
      src: url("../assets/fonts/dm-sans/DMSans-VariableFont_opsz,wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DM Mono";
      src: url("../assets/fonts/dm-mono/DMMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --neutral-900: hsl(33 15% 15%);
      --neutral-400: hsl(36 22% 86%);
      --neutral-100: hsl(35 60% 96%);
      --terracotta-700: hsl(15 69% 37%);
      color: var(--neutral-900);
      font-family: "DM Sans", sans-serif;
      background: #efefee;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    .preview-stage {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
      padding: 5.35rem 4.35rem;
      background: #efefee;
    }

    .construction-label {
      position: fixed;
      z-index: 50;
      top: 1rem;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 0.8rem;
      transform: translateX(-50%);
      border: 1px solid #d7d3cd;
      border-radius: 999px;
      color: #5a5248;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 5px 16px rgb(43 38 32 / 8%);
      font-size: 0.75rem;
    }

    .construction-label span {
      color: var(--terracotta-700);
      font-family: "DM Mono", monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hotel-app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 235px minmax(0, 1fr);
      width: min(1300px, calc(100vw - 8.7rem));
      min-height: 882px;
      overflow: hidden;
      border: 1px solid rgb(43 38 32 / 5%);
      border-radius: 16px;
      background: var(--neutral-100);
      box-shadow: 0 22px 28px rgb(43 38 32 / 24%);
    }

    .sidebar-geometry {
      min-width: 0;
      border-right: 1px solid var(--neutral-400);
      background: var(--neutral-100);
    }

    .app-content {
      min-width: 0;
    }

    @media (max-width: 1080px) {
      .preview-stage {
        padding: 0;
      }

      .hotel-app {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (max-width: 800px) {
      .construction-label {
        display: none;
      }

      .hotel-app {
        display: block;
        overflow: visible;
      }

      .sidebar-geometry {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="preview-stage">
    <div class="construction-label" aria-hidden="true">
      <span>Step 03</span>
      Left-column geometry
    </div>

    <section class="hotel-app" aria-label="Maison Soleil application shell">
      <aside class="sidebar-geometry" aria-label="Future sidebar region"></aside>
      <div class="app-content"></div>
    </section>
  </main>
</body>
</html>
