<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="dashboard.css">
  <title>Dashboard</title>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">Pulse</div>
    <nav aria-label="Dashboard">
      <a class="active" href="#">Overview</a>
      <a href="#">Analytics</a>
      <a href="#">Customers</a>
      <a href="#">Settings</a>
    </nav>
  </aside>
  <main>
    <header>
      <div>
        <h1>Overview</h1>
        <p>Here is what is happening today.</p>
      </div>
      <div class="avatar">DC</div>
    </header>
    <section class="stats" aria-label="Statistics">
      <article><span>Revenue</span><strong>$24,800</strong><small>+12.5%</small></article>
      <article><span>Orders</span><strong>1,429</strong><small>+8.2%</small></article>
      <article><span>Customers</span><strong>892</strong><small>+5.1%</small></article>
    </section>
    <section class="activity">
      <h2>Weekly activity</h2>
      <div class="bar"><i style="width: 88%"></i></div>
      <div class="bar"><i style="width: 72%"></i></div>
      <div class="bar"><i style="width: 60%"></i></div>
      <div class="bar"><i style="width: 44%"></i></div>
    </section>
  </main>
</body>
</html>
