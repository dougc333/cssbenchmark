<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <title>Conference ticket decomposition — Step 1</title>
  <style>
    /* Step 1: reset, local type, showcase canvas, and app frame. */
    @font-face {
      font-family: "Inconsolata";
      src: url("../assets/fonts/Inconsolata-VariableFont_wdth,wght.ttf") format("truetype");
      font-weight: 400 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --neutral-0: hsl(0 0% 100%);
      --neutral-300: hsl(252 6% 83%);
      --neutral-500: hsl(245 15% 58%);
      --neutral-700: hsl(245 19% 35%);
      --neutral-900: hsl(248 70% 10%);
      --orange-500: hsl(7 88% 67%);
      --orange-700: hsl(7 71% 60%);
      color: var(--neutral-0);
      font-family: "Inconsolata", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #f3f3f3;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .showcase {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
      padding: 101px 120px;
      border:3px solid red;
    }

    .app {
      position: relative;
      z-index: 1;
      isolation: isolate;
      width: min(1200px, calc(100vw - 240px));
      aspect-ratio: 1200 / 854;
      overflow: hidden;
      background: var(--neutral-900);
      box-shadow: 0 18px 26px rgb(16 12 27 / 24%);
      border: 3px solid orange;
    }
    
  </style>
</head>
<body>
  <main class="showcase">
    
    <section class="app" aria-label="Coding Conf ticket confirmation">
      
      
      
      
      
    </section>
  </main>
</body>
</html>
