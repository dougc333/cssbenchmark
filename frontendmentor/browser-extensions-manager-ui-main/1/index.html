<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 1 — Canvas and typography</title>
  <style>
    @font-face {
      font-family: "Noto Sans";
      src: url("../assets/fonts/static/NotoSans-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Noto Sans";
      src: url("../assets/fonts/static/NotoSans-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Noto Sans";
      src: url("../assets/fonts/static/NotoSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --neutral-900: hsl(227 75% 14%);
      --neutral-800: hsl(226 25% 17%);
      --neutral-700: hsl(225 23% 24%);
      --neutral-600: hsl(226 11% 37%);
      --neutral-300: hsl(0 0% 78%);
      --neutral-200: hsl(217 61% 90%);
      --neutral-100: hsl(0 0% 93%);
      --neutral-0: hsl(200 60% 99%);
      --red-400: hsl(3 86% 64%);
      --red-500: hsl(3 71% 56%);
      --red-700: hsl(3 77% 44%);
      --page-gradient: linear-gradient(180deg, #040918 0%, #091540 100%);
      --surface: var(--neutral-800);
      --surface-elevated: var(--neutral-700);
      --text-primary: var(--neutral-0);
      --text-secondary: var(--neutral-300);
      --border: var(--neutral-600);
      --filter-active-bg: var(--red-700);
      --filter-active-text: var(--neutral-0);
      --filter-idle-bg: transparent;
      --filter-idle-text: var(--neutral-0);
      --filter-idle-border: var(--neutral-600);
      --remove-bg: var(--neutral-700);
      --remove-text: var(--neutral-0);
      --remove-border: var(--neutral-600);
      --toggle-off: var(--neutral-700);
      --toggle-on: var(--red-500);
      --brand-text: var(--neutral-0);
      --theme-btn-bg: var(--neutral-700);
      --theme-btn-border: var(--neutral-600);
      --header-shadow: none;
      --card-shadow: none;
      color: var(--text-primary);
      font-family: "Noto Sans", sans-serif;
      font-size: 16px;
      background: var(--page-gradient);
    }

    [data-theme="light"] {
      --page-gradient: linear-gradient(180deg, #ebf2fc 0%, #eef8f9 100%);
      --surface: var(--neutral-0);
      --surface-elevated: var(--neutral-0);
      --text-primary: var(--neutral-900);
      --text-secondary: var(--neutral-600);
      --border: var(--neutral-200);
      --filter-active-bg: var(--red-700);
      --filter-active-text: var(--neutral-0);
      --filter-idle-bg: var(--neutral-0);
      --filter-idle-text: var(--neutral-900);
      --filter-idle-border: var(--neutral-200);
      --remove-bg: var(--neutral-0);
      --remove-text: var(--neutral-900);
      --remove-border: var(--neutral-200);
      --toggle-off: var(--neutral-200);
      --toggle-on: var(--red-500);
      --brand-text: var(--neutral-900);
      --theme-btn-bg: var(--neutral-0);
      --theme-btn-border: var(--neutral-200);
      --header-shadow: 0 8px 24px rgb(9 21 64 / 8%);
      --card-shadow: 0 10px 24px rgb(9 21 64 / 8%);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    button { font: inherit; color: inherit; cursor: pointer; }

    .page {
      min-height: 100vh;
      padding: 2rem clamp(1.25rem, 8vw, 10rem) 3rem;
      background: var(--page-gradient);
    }

    .construction-label {
      position: fixed;
      z-index: 50;
      top: 1rem;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 0.85rem;
      transform: translateX(-50%);
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 999px;
      color: var(--neutral-0);
      background: rgb(34 40 58 / 72%);
      backdrop-filter: blur(8px);
      font-size: 0.75rem;
    }

    [data-theme="light"] .construction-label {
      border-color: var(--neutral-200);
      color: var(--neutral-900);
      background: rgb(255 255 255 / 88%);
    }

    .construction-label span {
      color: var(--red-400);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .app-shell {
      width: min(1110px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 2rem;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--surface);
      box-shadow: var(--header-shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
    }

    .brand-mark {
      flex: 0 0 auto;
      width: 2.5rem;
      height: 2.5rem;
    }

    .brand-name {
      margin: 0;
      color: var(--brand-text);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .theme-toggle {
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      padding: 0;
      border: 1px solid var(--theme-btn-border);
      border-radius: 0.5rem;
      background: var(--theme-btn-bg);
      transition: border-color 0.2s, transform 0.2s;
    }

    .theme-toggle:hover { border-color: var(--red-400); }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--red-400);
      outline-offset: 2px;
    }

    .theme-toggle img {
      width: 1.375rem;
      height: 1.375rem;
    }

    .theme-toggle .icon-sun { display: block; }
    .theme-toggle .icon-moon { display: none; }

    [data-theme="light"] .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-moon { display: block; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .page-title {
      margin: 0;
      font-size: clamp(1.75rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .filters {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      min-width: 5.5rem;
      padding: 0.65rem 1.25rem;
      border: 1px solid var(--filter-idle-border);
      border-radius: 999px;
      background: var(--filter-idle-bg);
      color: var(--filter-idle-text);
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .filter-btn:hover,
    .filter-btn:focus-visible {
      border-color: var(--red-400);
      outline: none;
    }

    .filter-btn--active {
      border-color: var(--filter-active-bg);
      background: var(--filter-active-bg);
      color: var(--filter-active-text);
    }

    .extensions-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.5rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .extensions-grid:empty {
      display: none;
    }

    .empty-state {
      margin: 0;
      padding: 2.5rem 1.5rem;
      border: 1px dashed var(--border);
      border-radius: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
      font-size: 1rem;
    }

    .empty-state[hidden] {
      display: none;
    }

    .extension-card {
      display: grid;
      gap: 1.25rem;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--surface-elevated);
      box-shadow: var(--card-shadow);
    }

    .extension-card__top {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      align-items: start;
    }

    .extension-card__logo {
      width: 3rem;
      height: 3rem;
      border-radius: 0.5rem;
    }

    .extension-card__title {
      margin: 0 0 0.35rem;
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .extension-card__description {
      margin: 0;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.5;
    }

    .extension-card__actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .remove-btn {
      padding: 0.55rem 1rem;
      border: 1px solid var(--remove-border);
      border-radius: 999px;
      background: var(--remove-bg);
      color: var(--remove-text);
      font-size: 1rem;
      font-weight: 500;
      transition: border-color 0.2s, color 0.2s;
    }

    .remove-btn:hover,
    .remove-btn:focus-visible {
      border-color: var(--red-400);
      color: var(--red-400);
      outline: none;
    }

    .toggle {
      position: relative;
      width: 2.75rem;
      height: 1.5rem;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: var(--toggle-off);
      transition: background 0.2s;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 0.1875rem;
      left: 0.1875rem;
      width: 1.125rem;
      height: 1.125rem;
      border-radius: 50%;
      background: var(--neutral-0);
      transition: transform 0.2s;
    }

    .toggle--on {
      background: var(--toggle-on);
    }

    .toggle--on::after {
      transform: translateX(1.25rem);
    }

    .toggle:focus-visible {
      outline: 2px solid var(--red-400);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1100px) {
      .page {
        padding: 2rem clamp(1.25rem, 5vw, 4rem) 3rem;
      }
    }

    @media (max-width: 900px) {
      .extensions-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 1.25rem 1rem 2rem;
      }

      .app-header {
        padding: 0.85rem 1rem;
      }

      .brand-name {
        font-size: 1.375rem;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .page-title {
        font-size: 1.75rem;
      }

      .filters {
        justify-content: center;
      }

      .filter-btn {
        flex: 1 1 auto;
        min-width: 0;
      }

      .extensions-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .extension-card {
        padding: 1rem;
      }
    }


  </style>
</head>
<body>
  <div class="page">

    <div class="construction-label" aria-hidden="true">
      <span>Step 01</span>
      Canvas and typography
    </div>
        
    <main class="app-shell" aria-label="Browser extensions manager">

    </main>
  </div>
</body>
</html>
