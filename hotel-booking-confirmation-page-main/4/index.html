<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 4 — Complete sidebar</title>
  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("../assets/fonts/fraunces/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DM Sans";
      src: url("../assets/fonts/dm-sans/DMSans-VariableFont_opsz,wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DM Mono";
      src: url("../assets/fonts/dm-mono/DMMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --neutral-900: hsl(33 15% 15%);
      --neutral-400: hsl(36 22% 86%);
      --neutral-100: hsl(35 60% 96%);
      --terracotta-700: hsl(15 69% 37%);
      color: var(--neutral-900);
      font-family: "DM Sans", sans-serif;
      background: #efefee;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    .preview-stage {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
      padding: 5.35rem 4.35rem;
      background: #efefee;
    }

    .construction-label {
      position: fixed;
      z-index: 50;
      top: 1rem;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 0.8rem;
      transform: translateX(-50%);
      border: 1px solid #d7d3cd;
      border-radius: 999px;
      color: #5a5248;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 5px 16px rgb(43 38 32 / 8%);
      font-size: 0.75rem;
    }

    .construction-label span {
      color: var(--terracotta-700);
      font-family: "DM Mono", monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hotel-app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 235px minmax(0, 1fr);
      width: min(1300px, calc(100vw - 8.7rem));
      min-height: 882px;
      overflow: hidden;
      border: 1px solid rgb(43 38 32 / 5%);
      border-radius: 16px;
      background: var(--neutral-100);
      box-shadow: 0 22px 28px rgb(43 38 32 / 24%);
    }

    .sidebar-geometry {
      min-width: 0;
      border-right: 1px solid var(--neutral-400);
      background: var(--neutral-100);
    }

    .app-content {
      min-width: 0;
    }

    .sidebar-geometry .sidebar-item {
      padding: 1.5rem;
      font-size: 1rem;
      line-height: 1.5;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }

    .sidebar-geometry .sidebar-item:hover {
      background-color: var(--neutral-400);
    }

    .sidebar-geometry .sidebar-item.active {
      background-color: var(--neutral-400);
    }

    .sidebar-geometry .sidebar-item.icon {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-geometry .sidebar-item.icon svg {
      width: 1.5rem;
      height: 1.5rem;
    }

    .sidebar-geometry .sidebar-item.text {
      font-family: "Fraunces", serif;
      font-style: italic;
    }

    .app-content {
      min-width: 0;
      padding: 1.5rem;
    }

    .app-content .weather-card {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      width: 180px;
      height: 120px;
      background: var(--neutral-100);
      border-radius: 16px;
      box-shadow: 0 22px 28px rgb(43 38 32 / 24%);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-direction: column;
    }

    .app-content .weather-card .temperature {
      font-size: 2rem;
      font-weight: bold;
    }

    .app-content .weather-card .description {
      font-size: 0.8rem;
      font-style: italic;
    }

    .app-content .footer {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      width: 100%;
      font-size: 0.75rem;
      color: var(--neutral-400);
      text-align: center;
    }

    @media (max-width: 1080px) {
      .preview-stage {
        padding: 0;
      }

      .hotel-app {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (max-width: 800px) {
      .construction-label {
        display: none;
      }

      .hotel-app {
        display: block;
        overflow: visible;
      }

      .sidebar-geometry {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="preview-stage">
    <div class="construction-label" aria-hidden="true">
      <span>Step 04</span>
      Complete sidebar
    </div>

    <section class="hotel-app" aria-label="Maison Soleil application shell">
      <aside class="sidebar-geometry" aria-label="Sidebar">
        <div class="sidebar-item icon active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-home"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="text">Your stay</span>
        </div>
        <div class="sidebar-item icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-house"><path d="M20 12v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
          <span class="text">The house</span>
        </div>
        <div class="sidebar-item icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-map-pin"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"/></svg>
          <span class="text">Around town</span>
        </div>
        <div class="sidebar-item icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-briefcase"><path d="M22 12h-4l-3 9L9 3l-3 9H2l15 0L9 21l-3-9z"/></svg>
          <span class="text">Breakfast</span>
        </div>
        <div class="sidebar-item icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-message-square"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span class="text">Messages</span>
        </div>
      </aside>
      <div class="app-content">
        <!-- Right content area remains empty -->
      </div>
    </section>
  </main>
</body>
</html>
