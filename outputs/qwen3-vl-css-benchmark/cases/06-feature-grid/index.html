<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="feature-cards.css">
  <title>Feature cards</title>
</head>
<body>
  <main class="features">
    <h1>Everything you need</h1>
    <p class="subtitle">Simple tools for productive teams.</p>
    <section class="card-grid">
      <article class="card">
        <div class="icon">⚡</div>
        <h2>Fast setup</h2>
        <p>Launch your workspace in just a few minutes.</p>
      </article>
      <article class="card">
        <div class="icon">✓</div>
        <h2>Clear tasks</h2>
        <p>Keep ownership and priorities visible.</p>
      </article>
      <article class="card">
        <div class="icon">↗</div>
        <h2>Live reports</h2>
        <p>Understand progress with simple reporting.</p>
      </article>
    </section>
  </main>
</body>
</html>
